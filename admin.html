<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - KFCEO</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="KFCEO 명품 19기 관리자 페이지">
    <meta property="og:description" content="한국프랜차이즈산업협회 공식 CEO교육 관리 시스템">
    <meta property="og:image" content="https://www.genspark.ai/api/files/s/4OtWZuBS">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-large">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1>관리자 로그인</h1>
                <p>KFCEO 교육과정 관리 시스템</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> 비밀번호
                    </label>
                    <input type="password" id="password" name="password" required placeholder="관리자 비밀번호 입력">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> 로그인
                </button>
                
                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i> <span></span>
                </div>
            </form>
            
            <div class="login-footer">
                <a href="index.html"><i class="fas fa-home"></i> 메인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script src="js/admin-login.js"></script>
</body>
</html>
